# 仅前端容器：Workshop 需在宿主机 :5000 或通过 host.docker.internal 访问
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NGINX_CONF: ${NGINX_CONF:-nginx.conf}
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
        VITE_RANK_VIDEO_MOCK: ${VITE_RANK_VIDEO_MOCK:-true}
        VITE_RANK_WEIBO_MOCK: ${VITE_RANK_WEIBO_MOCK:-false}
    container_name: frontend
    ports:
      - "80:80"
    # 让容器内 nginx 能访问宿主机上映射的 Crawl :8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 运行时可根据需要覆盖
      - NODE_ENV=production
    restart: unless-stopped
